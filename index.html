<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songwriter Ultra Studio v2</title>

<style>

body{
margin:0;
font-family:-apple-system,Arial;
background:#0f1115;
color:#e9eef7;
overflow:hidden;
}

header{
padding:12px;
background:#111827;
border-bottom:1px solid #273044;
display:flex;
gap:10px;
flex-wrap:wrap;
}

input{
flex:1;
min-width:220px;
padding:10px;
border-radius:10px;
border:none;
background:#05070b;
color:#ff5a5a;
font-size:16px;
}

.toolbar{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:10px;
background:#151923;
border-bottom:1px solid #273044;
}

button{
background:#1e2535;
color:white;
border:1px solid #34405a;
border-radius:10px;
padding:8px 12px;
cursor:pointer;
font-size:13px;
}

button:hover{
background:#29344d;
}

.layout{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
padding:10px;
height:68vh;
}

.panel{
background:#151923;
border:1px solid #273044;
border-radius:14px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.panel h3{
margin:0;
padding:10px;
font-size:14px;
color:#9aa6b2;
border-bottom:1px solid #273044;
}

textarea{
flex:1;
background:#05070b;
color:#e9eef7;
border:none;
padding:14px;
font-size:16px;
line-height:1.5;
resize:none;
outline:none;
}

.bottom{
height:22vh;
display:flex;
gap:10px;
padding:10px;
}

.assistant{
flex:1;
background:#151923;
border:1px solid #273044;
border-radius:14px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.assistant h3{
margin:0;
padding:10px;
font-size:14px;
color:#9aa6b2;
border-bottom:1px solid #273044;
}

#assistantOutput{

flex:1;

padding:12px;

overflow-y:auto;

white-space:pre-wrap;

line-height:1.7;

font-size:16px;

scroll-behavior:smooth;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#151923;
border:1px solid #444;
padding:10px 14px;
border-radius:12px;
opacity:0;
transition:.2s;
}

.toast.show{
opacity:1;
}

@media(max-width:1000px){

.layout{
grid-template-columns:1fr;
height:auto;
}

textarea{
min-height:250px;
}

.bottom{
flex-direction:column;
height:auto;
}

}

</style>
</head>

<body>

<header>

<input id="songTitle" placeholder="Songtitel">
<input id="songStyle" placeholder="Song Stil">

</header>

<div class="toolbar">

<button id="btnAll">🎹 Alles</button>
<button id="btnSplit">🎛 Split Variants</button>
<button id="btnCopy">📋 Suno Copy + Stil</button>

<button data-tag="Intro">Intro</button>
<button data-tag="Verse">Verse</button>
<button data-tag="Pre-Chorus">Pre</button>
<button data-tag="Chorus">Chorus</button>
<button data-tag="Refrain">Ref</button>
<button data-tag="Hook">Hook</button>
<button data-tag="Bridge">Bridge</button>
<button data-tag="Instrumental">Inst</button>
<button data-tag="Outro">Outro</button>

<button data-mood="melancholisch">🌧 Melancholisch</button>
<button data-mood="episch">⚡ Episch</button>
<button data-mood="dreamy">🌙 Dreamy</button>
<button data-mood="dark synth">🖤 Dark Synth</button>
<button data-mood="uplifting">☀️ Uplifting</button>

<button id="btnAssistant">🎤 KI-Assistent</button>

<button id="clearLeft">🗑 Links</button>
<button id="clearA">🗑 Mitte</button>
<button id="clearB">🗑 Rechts</button>

</div>

<div class="layout">

<div class="panel">
<h3>📝 Rohtext</h3>
<textarea id="left"></textarea>
</div>

<div class="panel">
<h3>🎹 Variante A</h3>
<textarea id="middle"></textarea>
</div>

<div class="panel">
<h3>🎶 Variante B</h3>
<textarea id="right"></textarea>
</div>

</div>

<div class="bottom">

<div class="assistant">
<h3>🎤 KI Songwriter Assistant</h3>
<div id="assistantOutput">
Markiere links eine Zeile oder mehrere Zeilen und drücke „KI-Assistent“.
</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>

const left=document.getElementById("left");
const middle=document.getElementById("middle");
const right=document.getElementById("right");

const title=document.getElementById("songTitle");
const style=document.getElementById("songStyle");

const assistant=document.getElementById("assistantOutput");
const toast=document.getElementById("toast");

let active=left;
let currentMood="neutral";

[left,middle,right].forEach(t=>{
  t.addEventListener("focus",()=>active=t);
  t.addEventListener("click",()=>active=t);
});

function msg(t){
  toast.textContent=t;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1400);
}

function getMarkedText(){
  if(left.selectionStart!==left.selectionEnd){
    return left.value.substring(left.selectionStart,left.selectionEnd).trim();
  }
  return left.value.trim();
}

function detectTheme(text){
  const t=text.toLowerCase();

  if(t.includes("kampf")||t.includes("spiel")||t.includes("ball")||t.includes("sieg")||t.includes("schiedsrichter")||t.includes("mannschaft")||t.includes("rugby")){
    return "sport";
  }

  if(t.includes("liebe")||t.includes("kuss")||t.includes("schatz")||t.includes("herz")||t.includes("liebsten")){
    return "liebe";
  }

  if(t.includes("regen")||t.includes("grau")||t.includes("kalt")||t.includes("frieren")){
    return "regen";
  }

  if(t.includes("nacht")||t.includes("sterne")||t.includes("mond")){
    return "nacht";
  }

  if(t.includes("meer")||t.includes("strand")||t.includes("wellen")||t.includes("sand")){
    return "meer";
  }

  return "allgemein";
}

function makeSuggestions(text){
  const theme=detectTheme(text);

  const banks={
    sport:[
      "Wir fallen hin und stehen wieder auf",
      "Der letzte Pfiff trägt unsern Traum",
      "Kein Schritt zurück, wir halten stand",
      "Mit Matsch im Gesicht und Feuer im Blick",
      "Der Sieg riecht nach Regen und kaltem Gras"
    ],
    liebe:[
      "Du wartest dort, wo mein Herz lauter schlägt",
      "Dein Blick macht selbst den Regen warm",
      "Ein Kuss reicht aus und alles wird leicht",
      "Bei dir wird selbst der Sonntag hell",
      "Du bist mein Heimweg nach dem Sturm"
    ],
    regen:[
      "Der Himmel wäscht den Tag ganz leise",
      "Aus grauen Wolken wächst ein Licht",
      "Wir frieren kurz und lachen später",
      "Der Regen schreibt uns auf die Haut",
      "Im kalten Wind bleibt Wärme übrig"
    ],
    nacht:[
      "Die Nacht trägt uns wie ein leises Lied",
      "Im Dunkeln glüht noch unser Mut",
      "Wir finden Licht, wo keines war",
      "Der Mond sieht zu und sagt kein Wort",
      "Bis früh am Morgen hält uns nichts"
    ],
    meer:[
      "Die Wellen nehmen unser Gestern mit",
      "Im Sand bleibt nur ein warmer Schritt",
      "Der Wind singt leise deinen Namen",
      "Wir laufen barfuß durch das Licht",
      "Das Meer hält fest, was uns bewegt"
    ],
    allgemein:[
      "Aus kleinen Zeilen wird ein großer Moment",
      "Wir gehen weiter, auch wenn keiner weiß wohin",
      "Ein neuer Morgen wartet schon",
      "Was eben schwer war, wird jetzt leicht",
      "Zwischen Zweifel wächst ein Lied"
    ]
  };

  let moodLine="";
  if(currentMood==="melancholisch") moodLine="sanfter, nachdenklicher";
  if(currentMood==="episch") moodLine="größer, kraftvoller";
  if(currentMood==="dreamy") moodLine="träumerischer, schwebender";
  if(currentMood==="dark synth") moodLine="dunkler, moderner";
  if(currentMood==="uplifting") moodLine="heller, hoffnungsvoller";

  let out="🎵 Markierter Text:\n"+text+"\n\n";
  out+="Erkanntes Thema: "+theme+"\n";
  out+="Mood: "+currentMood+(moodLine ? " ("+moodLine+")" : "")+"\n\n";
  out+="Vorschläge:\n\n";

  banks[theme].forEach(s=>{
    out+="→ "+applyMoodToLine(s)+"\n";
  });

  return out;
}

function applyMoodToLine(line){
  if(currentMood==="melancholisch") return line.replace("Licht","leises Licht");
  if(currentMood==="episch") return line+" — wir geben nicht auf";
  if(currentMood==="dreamy") return line+" im schimmernden Licht";
  if(currentMood==="dark synth") return line+" unter kaltem Neon";
  if(currentMood==="uplifting") return line+" und alles wird hell";
  return line;
}

/* Strukturbuttons */
document.querySelectorAll("[data-tag]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const tag=btn.dataset.tag;
    const pos=active.selectionStart||active.value.length;
    active.value=active.value.slice(0,pos)+"\n["+tag+"]\n"+active.value.slice(pos);
    active.focus();
  });
});

/* Alles übernehmen */
document.getElementById("btnAll").addEventListener("click",()=>{
  middle.value=left.value;
  right.value=left.value;
  msg("Alles übernommen 🎹");
});

/* Split Variants verbessert */
document.getElementById("btnSplit").addEventListener("click",()=>{
  const txt=left.value.trim();

  middle.value=
"[Variante A - kompakter]\n\n"+
txt
.replace(/Langsam, aber /gi,"")
.replace(/Noch nicht ganz ..., aber /gi,"")
.replace(/wirklich /gi,"")
.replace(/sehr /gi,"")
.replace(/\n{3,}/g,"\n\n");

  right.value=
"[Variante B - emotionaler]\n\n"+
txt+
"\n\n[Hook]\n"+
"Wir schenken uns nichts, wir geben nicht auf\n"+
"Mit kalten Händen und Feuer im Lauf\n"+
"Bis der letzte Pfiff den Himmel berührt";

  msg("Neue Varianten erzeugt 🎛");
});

/* Mood sichtbar */
document.querySelectorAll("[data-mood]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentMood=btn.dataset.mood;
    msg("Mood gesetzt: "+currentMood+" 🌈");
    middle.value="[Mood: "+currentMood+"]\n\n"+middle.value;
right.value="[Mood: "+currentMood+"]\n\n"+right.value;
});

/* Co-Writer */
document.getElementById("btnAssistant").addEventListener("click",()=>{
  const text=getMarkedText();

  if(!text){
    assistant.textContent="Bitte links Text markieren oder Rohtext einfügen.";
    return;
  }

  assistant.textContent=makeSuggestions(text);
  msg("Co-Writer hat zugehört 🎤");
});

/* Copy */
document.getElementById("btnSplit").addEventListener("click",()=>{

const txt=left.value.trim();

if(!txt){
msg("Bitte zuerst Rohtext eingeben");
return;
}

/* Variante A = kompakter */

middle.value=
"[Variante A - kompakter]\n\n"+
txt
.replace(/Langsam, aber /gi,"")
.replace(/wirklich /gi,"")
.replace(/sehr /gi,"")
.replace(/ganz /gi,"")
.replace(/Doch dann /gi,"Dann ")
.replace(/Die Sonne kommt jetzt hervor und /gi,"Die Sonne ")
.replace(/\n{3,}/g,"\n\n");

/* Variante B = emotionaler */

right.value=
"[Variante B - emotionaler]\n\n"+
txt+

"\n\n[Pre-Chorus]\n"+
"Wir stehen im Regen und geben nicht auf\n"+
"Der Himmel ist grau doch wir schauen hinauf"+

"\n\n[Hook]\n"+
"Wir schenken uns nichts — bis der letzte Atem fällt\n"+
"Mit Schlamm auf den Schuhen und Feuer in der Welt";

msg("Neue kreative Varianten erzeugt 🎛");

});
});

/* Löschen */
document.getElementById("clearLeft").addEventListener("click",()=>{
  if(confirm("Rohtext löschen?")){
    left.value="";
    msg("Links gelöscht");
  }
});
  

document.getElementById("clearA").addEventListener("click",()=>{
  if(confirm("Variante A löschen?")){
    middle.value="";
    msg("Mitte gelöscht");
  }
});

document.getElementById("clearB").addEventListener("click",()=>{
  if(confirm("Variante B löschen?")){
    right.value="";
    msg("Rechts gelöscht");
  }
});

</script>
</body>
</html>
