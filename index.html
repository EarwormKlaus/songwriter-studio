<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songwriter Ultra Studio v2</title>

<style>

body{
margin:0;
font-family:-apple-system,Arial;
background:#0f1115;
color:#e9eef7;
overflow:hidden;
}

header{
padding:12px;
background:#111827;
border-bottom:1px solid #273044;
display:flex;
gap:10px;
flex-wrap:wrap;
}

input{
flex:1;
min-width:220px;
padding:10px;
border-radius:10px;
border:none;
background:#05070b;
color:#ff5a5a;
font-size:16px;
}

.toolbar{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:10px;
background:#151923;
border-bottom:1px solid #273044;
}

button{
background:#1e2535;
color:white;
border:1px solid #34405a;
border-radius:10px;
padding:8px 12px;
cursor:pointer;
font-size:13px;
}

button:hover{
background:#29344d;
}

.layout{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
padding:10px;
height:68vh;
}

.panel{
background:#151923;
border:1px solid #273044;
border-radius:14px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.panel h3{
margin:0;
padding:10px;
font-size:14px;
color:#9aa6b2;
border-bottom:1px solid #273044;
}

textarea{
flex:1;
background:#05070b;
color:#e9eef7;
border:none;
padding:14px;
font-size:16px;
line-height:1.5;
resize:none;
outline:none;
}

.bottom{
height:22vh;
display:flex;
gap:10px;
padding:10px;
}

.assistant{
flex:1;
background:#151923;
border:1px solid #273044;
border-radius:14px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.assistant h3{
margin:0;
padding:10px;
font-size:14px;
color:#9aa6b2;
border-bottom:1px solid #273044;
}

#assistantOutput{
flex:1;
padding:12px;
overflow:auto;
white-space:pre-wrap;
line-height:1.5;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#151923;
border:1px solid #444;
padding:10px 14px;
border-radius:12px;
opacity:0;
transition:.2s;
}

.toast.show{
opacity:1;
}

@media(max-width:1000px){

.layout{
grid-template-columns:1fr;
height:auto;
}

textarea{
min-height:250px;
}

.bottom{
flex-direction:column;
height:auto;
}

}

</style>
</head>

<body>

<header>

<input id="songTitle" placeholder="Songtitel">
<input id="songStyle" placeholder="Song Stil">

</header>

<div class="toolbar">

<button id="btnAll">🎹 Alles</button>
<button id="btnSplit">🎛 Split Variants</button>
<button id="btnCopy">📋 Suno Copy + Stil</button>

<button data-tag="Intro">Intro</button>
<button data-tag="Verse">Verse</button>
<button data-tag="Pre-Chorus">Pre</button>
<button data-tag="Chorus">Chorus</button>
<button data-tag="Refrain">Ref</button>
<button data-tag="Hook">Hook</button>
<button data-tag="Bridge">Bridge</button>
<button data-tag="Instrumental">Inst</button>
<button data-tag="Outro">Outro</button>

<button data-mood="melancholisch">🌧 Melancholisch</button>
<button data-mood="episch">⚡ Episch</button>
<button data-mood="dreamy">🌙 Dreamy</button>
<button data-mood="dark synth">🖤 Dark Synth</button>
<button data-mood="uplifting">☀️ Uplifting</button>

<button id="btnAssistant">🎤 KI-Assistent</button>

<button id="clearLeft">🗑 Links</button>
<button id="clearA">🗑 Mitte</button>
<button id="clearB">🗑 Rechts</button>

</div>

<div class="layout">

<div class="panel">
<h3>📝 Rohtext</h3>
<textarea id="left"></textarea>
</div>

<div class="panel">
<h3>🎹 Variante A</h3>
<textarea id="middle"></textarea>
</div>

<div class="panel">
<h3>🎶 Variante B</h3>
<textarea id="right"></textarea>
</div>

</div>

<div class="bottom">

<div class="assistant">
<h3>🎤 KI Songwriter Assistant</h3>
<div id="assistantOutput">
Markiere links eine Zeile oder mehrere Zeilen und drücke „KI-Assistent“.
</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>

const left=document.getElementById("left");
const middle=document.getElementById("middle");
const right=document.getElementById("right");

const title=document.getElementById("songTitle");
const style=document.getElementById("songStyle");

const assistant=document.getElementById("assistantOutput");
const toast=document.getElementById("toast");

let active=left;

/* aktive textarea */

[left,middle,right].forEach(t=>{

t.addEventListener("focus",()=>active=t);
t.addEventListener("click",()=>active=t);

});

/* toast */

function msg(t){

toast.textContent=t;
toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},1400);

}

/* struktur */

document.querySelectorAll("[data-tag]").forEach(btn=>{

btn.addEventListener("click",()=>{

const tag=btn.dataset.tag;

const pos=active.selectionStart||active.value.length;

active.value=
active.value.slice(0,pos)
+"\n["+tag+"]\n"
+active.value.slice(pos);

active.focus();

});

});

/* alles */

document.getElementById("btnAll").addEventListener("click",()=>{

middle.value=left.value;
right.value=left.value;

msg("Alles übernommen 🎹");

});

/* split variants */

document.getElementById("btnSplit").addEventListener("click",()=>{

const txt=left.value;

middle.value=
txt
.replace(/sehr/g,"")
.replace(/wirklich/g,"")
.replace(/\n{3,}/g,"\n\n");

right.value=
txt
+"\n\n[Hook]\n"
+"Bleib noch hier in dieser Nacht";

msg("Varianten erzeugt 🎛");

});

/* moods */

document.querySelectorAll("[data-mood]").forEach(btn=>{

btn.addEventListener("click",()=>{

const mood=btn.dataset.mood;

middle.value=
"[Mood: "+mood+"]\n\n"+middle.value;

right.value=
"[Mood: "+mood+"]\n\n"+right.value;

msg("Mood angewendet 🌈");

});

});

/* KI ASSISTENT */

const suggestions=[

"Ich hör dein Echo durch die Nacht",
"Die Sterne tragen deinen Namen",
"Im Neonlicht verlieren wir die Zeit",
"Dein Herz schlägt leise gegen meins",
"Wir tanzen weiter bis der Morgen bricht",
"Zwischen Schatten lebt noch Licht",
"Ich trag die Träume durch die Nacht",
"Dein Blick klingt wie ein letzter Song",
"Im Regen glüht noch unser Licht",
"Wir fallen langsam Richtung Himmel"

];

document.getElementById("btnAssistant").addEventListener("click",()=>{

let text="";

if(left.selectionStart!==left.selectionEnd){

text=
left.value.substring(
left.selectionStart,
left.selectionEnd
);

}else{

text=left.value;

}

const lines=text
.split("\n")
.filter(l=>l.trim()!="");

let out="";

lines.forEach(line=>{

out+="🎵 "+line+"\n\n";

for(let i=0;i<3;i++){

const s=
suggestions[
Math.floor(Math.random()*suggestions.length)
];

out+="→ "+s+"\n";

}

out+="\n";

});

assistant.textContent=out;

msg("KI Vorschläge erzeugt 🎤");

});

/* copy */

document.getElementById("btnCopy").addEventListener("click",async()=>{

const txt=
"Titel: "+title.value+"\n\n"
+"Stil: "+style.value+"\n\n"
+right.value;

try{

await navigator.clipboard.writeText(txt);

msg("Suno-Ready kopiert 📋");

}catch(e){

right.select();
document.execCommand("copy");

msg("Kopiert 📋");

}

});

/* löschen */

document.getElementById("clearLeft").addEventListener("click",()=>{

if(confirm("Rohtext löschen?")){

left.value="";
msg("Links gelöscht");

}

});

document.getElementById("clearA").addEventListener("click",()=>{

if(confirm("Variante A löschen?")){

middle.value="";
msg("Mitte gelöscht");

}

});

document.getElementById("clearB").addEventListener("click",()=>{

if(confirm("Variante B löschen?")){

right.value="";
msg("Rechts gelöscht");

}

});

</script>

</body>
</html>
